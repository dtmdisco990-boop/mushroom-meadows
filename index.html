<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#133c31" />
    <meta
      name="description"
      content="Mushroom Meadow: a playable lane-defense fan-game prototype. Build your defenses and help Mario protect the castle."

    <script src="js/defender-animator.js"></script>
    <script src="js/scenes.js"></script>
    <script src="js/endless-ui.js"></script>
